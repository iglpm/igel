[workspace]
resolver = "2"
members = [
    "crates/igel-common",
    "crates/igel-manifest",
    "crates/igel-graph",
    "crates/igel-fingerprint",
    "crates/igel-scheduler",
    "crates/igel-compiler",
    "crates/igel-cas",
    "crates/igel-registry",
    "crates/igel-resolver",
    "crates/igel-cli",
    "bench",
    "hyprlnk",
]
# rustc-runified: its own workspace, built with the compiler it patches; rust-lang/rust inside
# it has crates that belong to no workspace, and Cargo must not take them for members of this
# one. hyprcross: a project of its own, with its own hyprlnk submodule (pinned by hyprcross);
# two packages named hyprlnk can't share a workspace.
exclude = ["rustc-runified", "hyprcross", "hyprc"]

[workspace.package]
version = "2027.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/runepm/igel"
homepage = "https://runepm.com"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
bincode = "1.3"

# Networking & Compression
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "blocking", "json", "gzip", "http2", "stream"] }
flate2 = "1.0"
zstd = { version = "0.13", default-features = false }
tar = "0.4"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1"

# Parallelism
jobserver = "0.1"
rayon = "1"
crossbeam-channel = "0.5"

# CLI & UI
clap = { version = "4", features = ["derive", "wrap_help"] }
colored = "2"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
console = "0.15"

# Error Handling
thiserror = "2"
anyhow = "1"

# Utilities
semver = { version = "1", features = ["serde"] }
glob = "0.3"
cfg-expr = { version = "0.17", features = ["targets"] }
home = "0.5"
filetime = "0.2"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
walkdir = "2"
libc = "0.2"
same-file = "1.0"
dunce = "1.0"

# Internal crates
igel-common = { path = "crates/igel-common" }
igel-manifest = { path = "crates/igel-manifest" }
igel-graph = { path = "crates/igel-graph" }
igel-fingerprint = { path = "crates/igel-fingerprint" }
igel-scheduler = { path = "crates/igel-scheduler" }
igel-compiler = { path = "crates/igel-compiler" }
igel-cas = { path = "crates/igel-cas" }
igel-registry = { path = "crates/igel-registry" }
igel-resolver = { path = "crates/igel-resolver" }
hyprlnk = { path = "hyprlnk" }
# Cross-compilation (`igl cross`, `--cross`), without the hyprlnk it would bring: Igel links
# with its own.
hyprcross = { path = "hyprcross", default-features = false }
hyprc = { path = "hyprc", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
