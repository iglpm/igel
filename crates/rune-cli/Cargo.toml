[package]
name = "rune-cli"
description = "A fast build system and package manager for Rust, compatible with Cargo projects"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["build", "cargo", "package-manager", "cache", "cli"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[[bin]]
name = "rune"
path = "src/main.rs"

[dependencies]
rune-common.workspace = true
rune-manifest.workspace = true
rune-graph.workspace = true
rune-fingerprint.workspace = true
rune-scheduler.workspace = true
rune-cas.workspace = true
rune-registry.workspace = true
rune-resolver.workspace = true
clap.workspace = true
clap_complete = "4"
colored.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
home.workspace = true
crossbeam-channel.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
indicatif.workspace = true
console.workspace = true
semver.workspace = true
rayon.workspace = true
tar.workspace = true
flate2.workspace = true
glob.workspace = true
walkdir.workspace = true
filetime.workspace = true
blake3.workspace = true
rustc-demangle = "0.1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
