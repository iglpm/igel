name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml links aarch64-apple-darwin with lld.
      - if: runner.os == 'macOS'
        run: brew install lld
      - run: cargo test --workspace

  windows:
    # Release binaries are built for Windows: keep the code compiling there.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p rune-cli
      - run: ./target/release/rune.exe --version

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  self-host:
    # Rune builds and tests itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rune-cli
      - run: ./target/release/rune build --release
      - run: ./target/release/rune test --no-doc -p rune-resolver -p rune-cas

  bench:
    # A short benchmark against Cargo on every change: keeps rune-bench
    # working and leaves the report as an artifact (shared runners are too
    # noisy to gate on; use `rune-bench compare` on a quiet machine for that).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rune-cli -p rune-bench
      - run: >
          ./target/release/rune-bench run --workload tiny --workload medium
          --runs 3 --runs-heavy 2 --rune target/release/rune --out bench-results
      - uses: actions/upload-artifact@v4
        with:
          name: rune-bench-report
          path: |
            bench-results/report.html
            bench-results/report.md
            bench-results/results.json
