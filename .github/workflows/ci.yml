name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GIT_AUTHOR_NAME: "runified"
  GIT_AUTHOR_EMAIL: "runified@runepm.com"
  GIT_COMMITTER_NAME: "runified"
  GIT_COMMITTER_EMAIL: "runified@runepm.com"

jobs:
  lint:
    runs-on: [self-hosted, ci]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: true  # hyprlnk/
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows too: read-only store files, `.exe` names, path separators
        # and `file:` URLs all behave differently there.
        include:
          - os: [self-hosted, ci]
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: true  # hyprlnk/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml links aarch64-apple-darwin with lld.
      - if: runner.os == 'macOS'
        run: brew install lld
      - run: cargo test --workspace

  windows:
    # Release binaries are built for Windows: keep the code compiling there.
    runs-on: windows-2022
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: true  # hyprlnk/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p igel-cli
      - run: ./target/release/igl.exe --version
      - name: Smoke test (new, add, build, run, test, cached rebuild)
        shell: bash
        run: |
          set -eux
          igl="$PWD/target/release/igl.exe"
          export IGEL_HOME="$RUNNER_TEMP/igel-home"
          cd "$RUNNER_TEMP"
          "$igl" new smoke
          cd smoke
          "$igl" add itoa
          cat > src/lib.rs <<'EOF'
          /// Formats a number.
          ///
          /// ```
          /// assert_eq!(smoke::fmt(42), "42");
          /// ```
          pub fn fmt(n: u32) -> String {
              itoa::Buffer::new().format(n).to_string()
          }

          #[test]
          fn formats() {
              assert_eq!(fmt(12), "12");
          }
          EOF
          cat > src/main.rs <<'EOF'
          fn main() {
              println!("{}", smoke::fmt(7));
          }
          EOF
          "$igl" build
          test "$("$igl" run -q)" = "7"
          test -f .igel/target/debug/smoke.exe
          "$igl" test 2>&1 | tee test.log
          grep -q "doc-tests" test.log
          "$igl" check
          # A fresh checkout restores everything from the store.
          rm -rf .igel
          "$igl" build 2>&1 | tee build.log
          grep -q "0 compiled" build.log

  msrv:
    runs-on: [self-hosted, ci]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: true  # hyprlnk/
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  self-host:
    # Igel builds and tests itself.
    runs-on: [self-hosted, ci]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: true  # hyprlnk/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p igel-cli
      - run: ./target/release/igl build --release
      - run: ./target/release/igl test --no-doc -p igel-resolver -p igel-cas

  bench:
    # A short benchmark against Cargo on every change: keeps igel-bench
    # working and leaves the report as an artifact (shared runners are too
    # noisy to gate on; use `igel-bench compare` on a quiet machine for that).
    runs-on: [self-hosted, ci]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: true  # hyprlnk/
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p igel-cli -p igel-bench
      - run: >
          ./target/release/igel-bench run --workload tiny --workload medium
          --runs 3 --runs-heavy 2 --igl target/release/igl --out bench-results
      - uses: actions/upload-artifact@v4
        with:
          name: igel-bench-report
          path: |
            bench-results/report.html
            bench-results/report.md
            bench-results/results.json
