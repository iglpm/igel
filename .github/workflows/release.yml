name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GIT_AUTHOR_NAME: "runified"
  GIT_AUTHOR_EMAIL: "runified@runepm.com"
  GIT_COMMITTER_NAME: "runified"
  GIT_COMMITTER_EMAIL: "runified@runepm.com"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
    runs-on: [self-hosted, docker-builds]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: true  # hyprlnk/
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Podman and build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns
          podman info || true

      - name: Build hyprcross / rune locally first
        env:
          RUNE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          cargo build --release --locked -p rune-cli
          echo "$PWD/target/release" >> $GITHUB_PATH

      - name: Cross-compile target with hyprcross
        env:
          RUNE_BUILD_COMMIT: ${{ github.sha }}
          HYPRCROSS_CONTAINER_ENGINE: podman
        run: |
          rune cross build --release --locked --target ${{ matrix.target }} || \
          cargo run --release -p rune-cli -- cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name=rune-${{ matrix.target }}
          mkdir "$name"
          bin="rune"
          
          bin_path=$(find target/ -name "rune" -o -name "rune.exe" | grep "${{ matrix.target }}" | head -n 1)
          if [ -z "$bin_path" ]; then
            bin_path="target/release/rune"
            if [ ! -f "$bin_path" ]; then bin_path="target/release/rune.exe"; fi
          fi

          cp "$bin_path" README.md LICENSE-MIT.md LICENSE-APACHE.md "$name/"
          
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            "$name/$(basename "$bin_path")" --version
          fi

          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rune-${{ matrix.target }}
          path: rune-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: [self-hosted, ci]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: true  # hyprlnk/
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}
          files: dist/*
          body_path: notes.md
