name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # .cargo/config.toml links aarch64-apple-darwin with lld.
      - if: runner.os == 'macOS'
        run: brew install lld
      - name: Build
        env:
          RUNE_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p rune-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=rune-${{ matrix.target }}
          mkdir "$name"
          bin="rune"
          if [ -f "target/${{ matrix.target }}/release/rune.exe" ]; then
            bin="rune.exe"
          fi
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE-MIT.md LICENSE-APACHE.md "$name/"
          "$name/$bin" --version
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rune-${{ matrix.target }}
          path: rune-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
